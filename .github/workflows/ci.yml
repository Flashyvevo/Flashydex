name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install recognition dependencies
        run: python -m pip install -e "services/recognition[dev]"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Vitest
        run: npm run test --workspace=@pokescan/web
      - name: Pytest
        run: python -m pytest services/recognition/tests
      - name: Next build
        run: npm run build
      - name: Playwright smoke (non-blocking)
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
