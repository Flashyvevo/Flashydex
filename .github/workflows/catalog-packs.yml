name: Catalog packs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # weekly, Mondays 05:17 UTC

permissions:
  contents: write

concurrency:
  group: catalog-packs
  cancel-in-progress: false

env:
  # Owner-created dedicated public pack site. This is also the production
  # FLASHYDEX_MANIFEST_URL origin documented in docs/DEPLOY-NETLIFY.md.
  PACKS_ORIGIN: https://flashydex-catalog-packs.netlify.app

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compute immutable release version and tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y.%m.%d)"
          VERSION="${DATE}.$(printf '%03d' $(( GITHUB_RUN_NUMBER % 1000 )))"
          TAG="catalog-v${DATE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; catalog tags are immutable and date-scoped." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Restore TCGdex crawl cache
        uses: actions/cache@v4
        with:
          path: tools/catalog-builder/.cache
          key: tcgdex-crawl-v1-${{ runner.os }}-${{ steps.ver.outputs.version }}
          restore-keys: |
            tcgdex-crawl-v1-${{ runner.os }}-
      - name: Build both full language packs
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for L in en ja; do
            npm run catalog:build -- --lang "$L" --version "$VERSION" --out tools/catalog-builder/dist --cache-dir tools/catalog-builder/.cache --base-url "$PACKS_ORIGIN" --concurrency 8
          done
          test -f tools/catalog-builder/dist/catalog-en-"${VERSION}".db.zst
          test -f tools/catalog-builder/dist/catalog-ja-"${VERSION}".db.zst
          test -f tools/catalog-builder/dist/catalog-en-"${VERSION}".metrics.json
          test -f tools/catalog-builder/dist/catalog-ja-"${VERSION}".metrics.json
      - name: Validate catalog manifest schema and Netlify pack URLs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-catalog-manifest.mjs tools/catalog-builder/dist/catalog-manifest.json
          if grep -E '"(fullPackUrl|setIndexUrl)"' tools/catalog-builder/dist/catalog-manifest.json | grep -Fv "$PACKS_ORIGIN/"; then
            echo "manifest contains a non-Netlify pack URL" >&2
            exit 1
          fi
      - name: Verify built packs (hashes, counts, integrity, live TCGdex spot checks)
        shell: bash
        run: |
          set -euo pipefail
          cd tools/catalog-builder
          npx tsx src/verify-pack.ts dist/catalog-manifest.json > dist/verify-pack-report.json
          cat dist/verify-pack-report.json
      - name: Upload pack build artifacts and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-packs-${{ steps.ver.outputs.version }}
          path: |
            tools/catalog-builder/dist/catalog-manifest.json
            tools/catalog-builder/dist/catalog-*.db.zst
            tools/catalog-builder/dist/catalog-*.metrics.json
            tools/catalog-builder/dist/set-index-*.json
            tools/catalog-builder/dist/verify-pack-report.json
          if-no-files-found: warn
      - name: Create draft release, upload complete asset set, publish
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cd tools/catalog-builder/dist
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "Catalog packs ${VERSION}" \
            --notes "Full EN and JA catalog packs ${VERSION}; built by workflow run ${GITHUB_RUN_ID}. Hosted for clients on Netlify; GitHub is the immutable release archive."
          gh release upload "$TAG" \
            catalog-en-"${VERSION}".db.zst \
            catalog-ja-"${VERSION}".db.zst \
            catalog-en-"${VERSION}".metrics.json \
            catalog-ja-"${VERSION}".metrics.json \
            set-index-en.json set-index-ja.json catalog-manifest.json
          ASSETS="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | join(" ")')"
          for ASSET in catalog-en-"${VERSION}".db.zst catalog-ja-"${VERSION}".db.zst catalog-en-"${VERSION}".metrics.json catalog-ja-"${VERSION}".metrics.json set-index-en.json set-index-ja.json catalog-manifest.json; do
            grep -Fqx "$ASSET" <<< "$(tr ' ' '\n' <<< "$ASSETS")"
          done
          # Read-back: download the draft assets and verify bytes against the local build before publishing.
          READBACK="$(mktemp -d)"
          gh release download "$TAG" --dir "$READBACK" --clobber
          for ASSET in catalog-en-"${VERSION}".db.zst catalog-ja-"${VERSION}".db.zst catalog-en-"${VERSION}".metrics.json catalog-ja-"${VERSION}".metrics.json set-index-en.json set-index-ja.json catalog-manifest.json; do
            test -f "$READBACK/$ASSET" || { echo "missing downloaded asset $ASSET" >&2; exit 1; }
            LOCAL_LEN="$(stat -c %s "$ASSET")"; REMOTE_LEN="$(stat -c %s "$READBACK/$ASSET")"
            LOCAL_SHA="$(sha256sum "$ASSET" | cut -d' ' -f1)"; REMOTE_SHA="$(sha256sum "$READBACK/$ASSET" | cut -d' ' -f1)"
            if [ "$LOCAL_LEN" != "$REMOTE_LEN" ] || [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
              echo "read-back mismatch for $ASSET: local ${LOCAL_LEN}/${LOCAL_SHA} remote ${REMOTE_LEN}/${REMOTE_SHA}" >&2
              exit 1
            fi
          done
          # Cross-check downloaded packs against the manifest's compressedBytes/compressedSha256.
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const dir = process.argv[1], version = process.argv[2];
            const manifest = JSON.parse(fs.readFileSync(dir + "/catalog-manifest.json", "utf8"));
            for (const lang of ["en", "ja"]) {
              const entry = manifest.languages[lang];
              const buf = fs.readFileSync(dir + "/catalog-" + lang + "-" + version + ".db.zst");
              const sha = crypto.createHash("sha256").update(buf).digest("hex");
              if (buf.length !== entry.compressedBytes || sha !== entry.compressedSha256) {
                console.error("manifest mismatch for " + lang + ": " + buf.length + "/" + sha + " vs " + entry.compressedBytes + "/" + entry.compressedSha256);
                process.exit(1);
              }
            }
            console.log("release read-back verified");
          ' "$READBACK" "$VERSION"
          gh release edit "$TAG" --draft=false
      - name: Stage the dedicated Netlify packs site
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/netlify/prepare-pack-site.sh tools/catalog-builder/dist .netlify-packs-site
          test -f .netlify-packs-site/catalog-manifest.json
      - name: Deploy current packs and stable manifest to Netlify
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PACKS_SITE_ID }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"
          npx --yes netlify-cli@17.37.2 deploy --dir .netlify-packs-site --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
      - name: Verify deployed manifest and packs from the outside (bytes, CORS, MIME, caching)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location "$PACKS_ORIGIN/catalog-manifest.json" -o deployed-catalog-manifest.json
          cmp tools/catalog-builder/dist/catalog-manifest.json deployed-catalog-manifest.json
          bash scripts/netlify/verify-pack-site.sh "$PACKS_ORIGIN" tools/catalog-builder/dist/catalog-manifest.json
