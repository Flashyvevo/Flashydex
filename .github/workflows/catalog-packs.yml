name: Catalog packs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # weekly, Mondays 05:17 UTC

permissions:
  contents: write

concurrency:
  group: catalog-packs
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compute immutable release version and tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y.%m.%d)"
          VERSION="${DATE}.$(printf '%03d' $(( GITHUB_RUN_NUMBER % 1000 )))"
          TAG="catalog-v${DATE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; catalog tags are immutable and date-scoped." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Restore TCGdex crawl cache
        uses: actions/cache@v4
        with:
          path: tools/catalog-builder/.cache
          key: tcgdex-crawl-v1-${{ runner.os }}-${{ steps.ver.outputs.version }}
          restore-keys: |
            tcgdex-crawl-v1-${{ runner.os }}-
      - name: Build both full language packs
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          for L in en ja; do
            npm run catalog:build -- --lang "$L" --version "$VERSION" --out tools/catalog-builder/dist --cache-dir tools/catalog-builder/.cache --base-url "$BASE_URL" --concurrency 8
          done
          test -f tools/catalog-builder/dist/catalog-en-"${VERSION}".db.zst
          test -f tools/catalog-builder/dist/catalog-ja-"${VERSION}".db.zst
          test -f tools/catalog-builder/dist/catalog-en-"${VERSION}".metrics.json
          test -f tools/catalog-builder/dist/catalog-ja-"${VERSION}".metrics.json
      - name: Validate catalog manifest schema and release URLs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-catalog-manifest.mjs tools/catalog-builder/dist/catalog-manifest.json
          if grep -E '"(fullPackUrl|setIndexUrl)"' tools/catalog-builder/dist/catalog-manifest.json | grep -v 'https://'; then
            echo "non-https pack URL in manifest" >&2
            exit 1
          fi
      - name: Upload pack build artifacts and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-packs-${{ steps.ver.outputs.version }}
          path: |
            tools/catalog-builder/dist/catalog-manifest.json
            tools/catalog-builder/dist/catalog-*.db.zst
            tools/catalog-builder/dist/catalog-*.metrics.json
            tools/catalog-builder/dist/set-index-*.json
          if-no-files-found: warn
      - name: Create draft release, upload complete asset set, publish
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cd tools/catalog-builder/dist
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "Catalog packs ${VERSION}" \
            --notes "Full EN and JA catalog packs ${VERSION}; built by workflow run ${GITHUB_RUN_ID}."
          gh release upload "$TAG" \
            catalog-en-"${VERSION}".db.zst \
            catalog-ja-"${VERSION}".db.zst \
            catalog-en-"${VERSION}".metrics.json \
            catalog-ja-"${VERSION}".metrics.json \
            set-index-en.json set-index-ja.json catalog-manifest.json
          ASSETS="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | join(" ")')"
          for ASSET in catalog-en-"${VERSION}".db.zst catalog-ja-"${VERSION}".db.zst catalog-en-"${VERSION}".metrics.json catalog-ja-"${VERSION}".metrics.json set-index-en.json set-index-ja.json catalog-manifest.json; do
            grep -Fqx "$ASSET" <<< "$(tr ' ' '\n' <<< "$ASSETS")"
          done
          gh release edit "$TAG" --draft=false
